version: 2

project_name: throt

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: throt
    main: ./cmd/throt
    binary: throt
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/cfcromn/Throt/internal/app.Version={{ .Version }}
  - id: throtd
    main: ./cmd/throtd
    binary: throtd
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/cfcromn/Throt/internal/app.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

release:
  prerelease: auto

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
