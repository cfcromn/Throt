version: 2

project_name: throt

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: throt
    main: ./cmd/throt
    binary: throt
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/cfcromn/Throt/internal/app.Version={{ .Version }}
  - id: throtd
    main: ./cmd/throtd
    binary: throtd
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/cfcromn/Throt/internal/app.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Fixed owners and commit-dated file times keep archives byte-identical
    # across machines and checkouts.
    builds_info: &file_info
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: *file_info
      - src: README.md
        info: *file_info
      - src: CHANGELOG.md
        info: *file_info

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

release:
  prerelease: auto

# Release notes come from CHANGELOG.md (see .github/workflows/release.yml,
# which passes the tag's section with --release-notes).
changelog:
  disable: true
