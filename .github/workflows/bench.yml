name: Bench

# Real-machine benchmarks (internal/bench) on hosted runners: the CPU
# scenarios, then the memory scenarios (THROT_BENCH_MEMORY=1), which drive
# the runner past its RAM. They can take over an hour per OS, so they run
# on demand (gh workflow run bench.yml) and weekly, never on push or pull
# request.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    # Hosted runners are disposable VMs, so the enforce-mode daemon's
    # process control is safe here, and macOS gets a real XNU kernel.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The CPU scenarios take about 10 minutes; each memory run is capped at
    # 7 minutes (3-minute job cap plus queue aging), 12 runs at worst.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Benchmark
        # Build the test binary and run it directly: under `go test`, the
        # `go` process (itself a heavy build) would be an ancestor of every
        # job and fold them into one workload.
        run: |
          go test -c -o "$RUNNER_TEMP/bench.test" ./internal/bench
          THROT_BENCH=1 THROT_BENCH_MEMORY=1 THROT_BENCH_OUT="$RUNNER_TEMP/bench-${{ matrix.os }}.md" \
            "$RUNNER_TEMP/bench.test" -test.run Bench -test.v -test.count=1 -test.timeout 115m
      - name: Summary
        if: always()
        run: |
          out="$RUNNER_TEMP/bench-${{ matrix.os }}.md"
          if [ -f "$out" ]; then
            { echo "## Bench: ${{ matrix.os }}"; cat "$out"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Bench: ${{ matrix.os }}: no results (see the log)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: ${{ runner.temp }}/bench-${{ matrix.os }}.md
          if-no-files-found: warn
