name: Bench

# Real-machine benchmarks (internal/bench) on hosted runners: the CPU and
# mixed scenarios, then the memory scenarios (THROT_BENCH_MEMORY=1), which
# drive the machine past its RAM: on macOS directly, on Linux in a container
# with a memory limit. They can take over an hour per OS, so they run on
# demand (gh workflow run bench.yml) and weekly, never on push or pull
# request.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    # Hosted runners are disposable VMs, so the enforce-mode daemon's
    # process control is safe here, and macOS gets a real XNU kernel.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # The CPU and mixed scenarios take about 15 minutes; each memory run is
    # capped at 7 minutes (3-minute job cap plus queue aging), 12 runs at
    # worst.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Sampler overhead
        # The macOS process sampler's two collectors side by side
        # (kern.proc.all and proc_info, and /bin/ps alone): probe lateness,
        # CPU, wall time percentiles and allocations per sample, before the
        # benchmarks load the machine. It never fails the benchmarks.
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          THROT_OVERHEAD=30s go test ./internal/platform -run 'Overhead|KernelCollector|SamplerPaths' \
            -bench SampleProcessesReal -benchtime 60x -v -count=1 -timeout 20m
      - name: Benchmark
        # Build the test binary and run it directly: under `go test`, the
        # `go` process (itself a heavy build) would be an ancestor of every
        # job and fold them into one workload.
        # The memory scenarios run here on macOS only: on a bare Linux
        # runner they exhaust RAM and the job is killed, so on Linux they
        # run in a container (next step).
        run: |
          go test -c -o "$RUNNER_TEMP/bench.test" ./internal/bench
          if [ "$RUNNER_OS" = macOS ]; then export THROT_BENCH_MEMORY=1; fi
          THROT_BENCH=1 THROT_BENCH_OUT="$RUNNER_TEMP/bench-${{ matrix.os }}.md" \
            "$RUNNER_TEMP/bench.test" -test.run Bench -test.v -test.count=1 -test.timeout 115m
      - name: Memory benchmark in a container
        # The memory scenarios on the runner's real kernel, in a container
        # whose memory limit they size from (3 GiB of RAM plus 1 GiB of
        # swap). The image is the one make bench uses, at go.mod's Go
        # version, because the benchmark builds its helpers with go. The
        # test binary is built without cgo so it runs on Alpine's musl.
        # It runs even when the CPU scenarios failed.
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          image="golang:$(go env GOVERSION | sed 's/^go//')-alpine"
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/bench-static.test" ./internal/bench
          docker run --rm --init --memory 3g --memory-swap 4g --cpus 2 \
            -v "$RUNNER_TEMP":/out \
            -e THROT_BENCH=1 -e THROT_BENCH_MEMORY=1 -e THROT_BENCH_OUT="/out/bench-${{ matrix.os }}.md" \
            "$image" /out/bench-static.test -test.run TestBenchMemory -test.v -test.count=1 -test.timeout 100m
      - name: Summary
        if: always()
        run: |
          out="$RUNNER_TEMP/bench-${{ matrix.os }}.md"
          if [ -f "$out" ]; then
            { echo "## Bench: ${{ matrix.os }}"; cat "$out"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Bench: ${{ matrix.os }}: no results (see the log)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: ${{ runner.temp }}/bench-${{ matrix.os }}.md
          if-no-files-found: warn
