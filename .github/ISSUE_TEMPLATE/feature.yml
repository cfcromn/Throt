name: Feature request
description: Propose a user problem or improvement
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: workload
    attributes:
      label: Workload / environment
      description: Agents, builds, containers, OS, and scale involved.
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What measurable improvement would make this successful?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Possible approach
      description: Optional. Describe implementation ideas or alternatives.
